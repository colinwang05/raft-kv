syntax = "proto3";

package raft;

option go_package = "github.com/colinwang05/raft-kv/proto";

// --- Inter-node Raft RPCs (design doc section 6) ---

message RequestVoteRequest {
  uint64 term = 1;
  int32 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  bytes command = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  int32 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}

// --- Client-facing KV API ---
//
// NOT specified in the design doc, which only defines the inter-node Raft
// RPCs above. Added here so cmd/client and cmd/server have a contract to
// compile against; refine (e.g. add streaming, batch ops) at milestone M4.

enum Operation {
  PUT = 0;
  DELETE = 1;
}

message PutRequest {
  string key = 1;
  string value = 2;
  string client_id = 3;
  uint64 request_id = 4;
}

message PutResponse {
  bool success = 1;
  int32 leader_id = 2; // set when success=false to redirect the client
}

message DeleteRequest {
  string key = 1;
  string client_id = 2;
  uint64 request_id = 3;
}

message DeleteResponse {
  bool success = 1;
  int32 leader_id = 2;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  string value = 2;
  int32 leader_id = 3; // set when this node is not the leader
}

service KVService {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Get(GetRequest) returns (GetResponse);
}
